<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice to Bullet Points</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>
        <i class="fas fa-microphone-alt"></i> Voice to Bullet Points
      </h1>
      <p class="subtitle">
        <i class="fas fa-circle"></i> record · transcribe - bullet point — all local
      </p>
    </header>

    <div id="status" class="status loading">
      <i class="fas fa-spinner fa-pulse"></i> Checking server...
    </div>

    <section class="section">
      <h2><i class="fas fa-waveform"></i> 1. Capture your note</h2>

      <div class="record-controls">
        <button id="recordBtn" class="btn primary" disabled>
          <i class="fas fa-microphone"></i> Start Recording
        </button>
        <span id="timer" class="timer">00:00</span>
      </div>

      <div class="divider"><span>or upload a file</span></div>

      <div class="upload-controls">
        <label for="audioUpload" class="upload-label">
          <i class="fas fa-cloud-upload-alt"></i> Choose audio
        </label>
        <input type="file" id="audioUpload" accept="audio/*" hidden>
        <span id="uploadFileName" class="upload-filename"></span>
      </div>

      <audio id="playback" controls class="hidden"></audio>
    </section>

    <section class="section hidden" id="transcriptSection">
      <h2><i class="fas fa-align-left"></i> 2. Transcript</h2>
      <div id="transcript" class="transcript"></div>
      <button id="flashcardBtn" class="btn secondary" style="margin-top: 1.5rem;">
        <i class="fas fa-bolt"></i> Generate Bullet Points →
      </button>
    </section>

    <section class="section hidden" id="flashcardSection">
      <h2><i class="fas fa-layer-group"></i> 3. Bullet Points</h2>
      <div id="flashcards" class="flashcards"></div>
    </section>

    <footer class="footer">
      <p>
        <i class="fas fa-lock"></i> 100% on-device · no cloud · no API keys
      </p>
      <p class="footer-sub">
        Built with <a href="https://qvac.tether.io" target="_blank" rel="noopener">QVAC</a>
        · by <a href="https://x.com/ashishghimxtff" target="_blank" rel="noopener">@ashishghimxtff</a>
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
